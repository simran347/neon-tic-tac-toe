<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Tic-Tac-Toe | Neon Edition</title>
  <link rel="stylesheet" href="tic.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="eyebrow"><span class="live-dot"></span> TWO PLAYER ARCADE</div>
      <h1>TIC <span>·</span> TAC <span>·</span> TOE</h1>
      <p class="subtitle">A little strategy. A little rivalry.</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card score-x">
        <span class="player-mark">X</span><span class="player-name">PLAYER X</span>
        <strong id="score-x">0</strong><small>WINS</small>
      </div>
      <div class="score-card score-draw">
        <span class="player-mark">＝</span><span class="player-name">DRAW</span>
        <strong id="score-draw">0</strong><small>TIES</small>
      </div>
      <div class="score-card score-o">
        <span class="player-mark">O</span><span class="player-name">PLAYER O</span>
        <strong id="score-o">0</strong><small>WINS</small>
      </div>
    </section>

    <section class="game-panel">
      <div class="turn-status" id="turn-status" aria-live="polite">
        <span class="turn-indicator" id="turn-indicator">O</span>
        <span><small>NOW PLAYING</small><strong id="turn-text">Player O's turn</strong></span>
      </div>
      <div class="game" role="group" aria-label="Tic-Tac-Toe board">
        <button class="box" aria-label="Row 1, column 1"></button>
        <button class="box" aria-label="Row 1, column 2"></button>
        <button class="box" aria-label="Row 1, column 3"></button>
        <button class="box" aria-label="Row 2, column 1"></button>
        <button class="box" aria-label="Row 2, column 2"></button>
        <button class="box" aria-label="Row 2, column 3"></button>
        <button class="box" aria-label="Row 3, column 1"></button>
        <button class="box" aria-label="Row 3, column 2"></button>
        <button class="box" aria-label="Row 3, column 3"></button>
      </div>
      <div class="actions">
        <button id="reset-btn" class="btn btn-secondary"><span>↻</span> Restart Round</button>
        <button id="new-btn" class="btn btn-primary"><span>✦</span> New Match</button>
      </div>
    </section>
    <p class="footer-note"><span>✦</span> TAKE YOUR SHOT · MAKE YOUR MOVE <span>✦</span></p>
  </main>
  <div class="toast hide" id="toast" role="status" aria-live="polite"></div>
  <script src="tic.js"></script>
</body>
</html>
